const API = '';
let token = localStorage.getItem('tf_admin_token') || '';

async function api(path, opts = {}) {
  const res = await fetch(API + path, {
    ...opts,
    headers: { 'Content-Type': 'application/json', Authorization: 'Bearer ' + token, ...(opts.headers || {}) },
  });
  if (res.status === 401) { showLogin(); throw new Error('未授权'); }
  const data = await res.json().catch(() => ({}));
  if (!res.ok) throw new Error(data.error || ('请求失败 ' + res.status));
  return data;
}

const STATUS = { stable:'稳定', unstable:'不稳定', offline:'已失效' };

function esc(s) { return String(s ?? '').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c])); }

// ---------- 未保存离开提醒（beforeunload 通用守卫）----------
function enableDirtyGuard(containerSel) {
  let dirty = false;
  const root = document.querySelector(containerSel);
  if (!root) return () => {};
  const mark = () => { dirty = true; };
  root.querySelectorAll('input, textarea, select').forEach((el) => {
    el.addEventListener('input', mark);
    el.addEventListener('change', mark);
  });
  const onBefore = (e) => { if (dirty) { e.preventDefault(); e.returnValue = ''; } };
  window.addEventListener('beforeunload', onBefore);
  return () => { dirty = false; window.removeEventListener('beforeunload', onBefore); };
}

// ---------- 自定义确认弹窗（替代原生 confirm，支持危险/普通区分）----------
function confirmDialog(msg, opts = {}) {
  const { danger = false, okText = '确定', cancelText = '取消' } = opts;
  return new Promise((resolve) => {
    const wrap = document.createElement('div');
    wrap.className = 'confirm-overlay';
    wrap.innerHTML = `
      <div class="confirm-box">
        <p class="confirm-msg">${esc(msg)}</p>
        <div class="confirm-actions">
          <button class="btn btn-ghost confirm-cancel">${esc(cancelText)}</button>
          <button class="btn ${danger ? 'btn-danger-solid' : 'btn-primary'} confirm-ok">${esc(okText)}</button>
        </div>
      </div>`;
    document.body.appendChild(wrap);
    const close = (val) => { wrap.remove(); resolve(val); };
    wrap.querySelector('.confirm-cancel').onclick = () => close(false);
    wrap.querySelector('.confirm-ok').onclick = () => close(true);
    wrap.addEventListener('click', (e) => { if (e.target === wrap) close(false); });
    document.addEventListener('keydown', function onKey(e) {
      if (e.key === 'Escape') { document.removeEventListener('keydown', onKey); close(false); }
    });
  });
}

// ---------- Toast 通知（轻量，不打断操作流）----------
function toast(msg, type = 'success', ms = 2600) {
  let wrap = document.getElementById('toast-wrap');
  if (!wrap) {
    wrap = document.createElement('div');
    wrap.id = 'toast-wrap';
    document.body.appendChild(wrap);
  }
  const el = document.createElement('div');
  el.className = `toast toast-${type}`;
  el.textContent = msg;
  wrap.appendChild(el);
  requestAnimationFrame(() => el.classList.add('show'));
  setTimeout(() => {
    el.classList.remove('show');
    setTimeout(() => el.remove(), 250);
  }, ms);
}

// ---------- 登录 ----------
function showLogin(msg = '') {
  document.getElementById('app').innerHTML = `
    <div class="login-wrap">
      <form id="login-form" class="card login-card">
        <h1 class="login-title">TokenFree 管理</h1>
        <p class="login-sub">请输入管理员密码</p>
        ${msg ? `<p class="login-error">${esc(msg)}</p>` : ''}
        <input type="password" id="pwd" class="inp form-row" placeholder="密码" autofocus />
        <button type="submit" class="btn btn-primary" style="width:100%">登录</button>
      </form>
    </div>`;
  document.getElementById('login-form').onsubmit = async (e) => {
    e.preventDefault();
    const password = document.getElementById('pwd').value;
    const res = await fetch(API + '/api/login', { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify({ password }) });
    const data = await res.json().catch(() => ({}));
    if (res.ok && data.token) {
      token = data.token; localStorage.setItem('tf_admin_token', token); showDashboard();
    } else {
      showLogin(data.error || '登录失败');
    }
  };
}

// ---------- 顶栏 ----------
function topbar(active) {
  const btn = (id, label, key) => `<button id="nav-${id}" class="${active === key ? 'active' : ''}">${label}</button>`;
  const sep = () => `<span class="nav-sep" aria-hidden="true"></span>`;
  return `
    <header class="topbar">
      <div class="topbar-inner">
        <span class="brand">TokenFree 管理</span>
        <div class="topbar-actions">
          <a href="/" target="_blank">前台</a>
          ${sep()}
          ${btn('dash', '站点', 'dash')}
          ${btn('subs', '投稿', 'subs')}
          ${btn('content', '内容', 'content')}
          ${btn('ann', '公告', 'ann')}
          ${sep()}
          ${btn('uptime', '监测', 'uptime')}
          ${btn('models', '模型', 'models')}
          ${sep()}
          ${btn('settings', '设置', 'settings')}
          ${btn('audit', '日志', 'audit')}
          ${sep()}
          <button id="logout">退出</button>
        </div>
      </div>
    </header>`;
}

function bindTopbar() {
  document.getElementById('logout').onclick = () => { localStorage.removeItem('tf_admin_token'); token = ''; showLogin(); };
  const map = { 'nav-dash': showDashboard, 'nav-subs': showSubmissions, 'nav-uptime': showUptime, 'nav-models': showModels, 'nav-content': showContent, 'nav-ann': showAnnouncements, 'nav-settings': showSettings, 'nav-audit': showAudit };
  for (const [id, fn] of Object.entries(map)) {
    const el = document.getElementById(id);
    if (el) el.onclick = fn;
  }
}

// ---------- 公告管理 ----------
function annHashId(s) {
  let h = 5381;
  for (let i = 0; i < s.length; i++) h = ((h << 5) + h + s.charCodeAt(i)) >>> 0;
  return 'ann-' + h.toString(36);
}

async function showAnnouncements(editingId = null) {
  const cfg = await api('/api/config');
  const list = cfg.announcements || [];
  window._cfg = cfg;
  const editing = editingId ? list.find((a) => a.id === editingId) : null;
  document.getElementById('app').innerHTML = `
    ${topbar('ann')}
    <main class="container container-sm">
      <div class="section-head">
        <h2 class="section-title">公告管理（${list.length}）</h2>
      </div>
      <div class="card" style="margin-bottom:20px">
        <p style="font-size:13px;font-weight:500;margin-bottom:12px">${editing ? '✏️ 编辑公告' : '📢 发布新公告'}</p>
        <form id="ann-form">
          <div class="form-grid">
            <div class="form-row">
              <label class="field-label">日期</label>
              <input id="a-date" class="inp" type="date" value="${esc(editing ? editing.date : new Date().toISOString().slice(0, 10))}" required />
            </div>
          </div>
          <div class="form-row" style="margin-top:14px">
            <label class="field-label">内容（前台弹窗 + 顶部公告条实时展示，无需重建）</label>
            <textarea id="a-text" class="inp" rows="3" required maxlength="200">${esc(editing ? editing.text : '')}</textarea>
          </div>
          <div class="form-actions">
            <button type="submit" class="btn btn-primary">${editing ? '保存修改' : '发布'}</button>
            ${editing ? '<button type="button" id="a-cancel" class="btn btn-ghost">取消编辑</button>' : ''}
          </div>
        </form>
      </div>
      ${list.length === 0 ? '<p class="hint">暂无公告</p>' : `
      <div class="table-wrap">
        <table>
          <thead><tr><th>日期</th><th>内容</th><th>状态</th><th></th></tr></thead>
          <tbody>
            ${list.map((a) => `
              <tr>
                <td class="cell-dim" style="white-space:nowrap">${esc(a.date)}</td>
                <td style="white-space:normal;min-width:240px">${esc(a.text)}</td>
                <td style="color:#22c555">已发布</td>
                <td class="cell-actions">
                  <button class="btn btn-ghost" data-edit-ann="${esc(a.id)}">编辑</button>
                  <button class="btn btn-danger" data-del-ann="${esc(a.id)}">删除</button>
                </td>
              </tr>`).join('')}
          </tbody>
        </table>
      </div>`}
      <p class="hint" style="margin-top:12px">提示：修改或新发布的内容会立即推送给用户（弹窗只对未读用户显示一次）。</p>
    </main>`;

  bindTopbar();
  const cancelBtn = document.getElementById('a-cancel');
  if (cancelBtn) cancelBtn.onclick = () => showAnnouncements();
  document.getElementById('ann-form').onsubmit = async (e) => {
    e.preventDefault();
    const date = document.getElementById('a-date').value;
    const text = document.getElementById('a-text').value.trim();
    if (!text) return;
    const anns = [...(window._cfg.announcements || [])];
    if (editing) {
      const i = anns.findIndex((a) => a.id === editing.id);
      anns[i] = { ...anns[i], date, text, id: annHashId(date + '|' + text) };
    } else {
      anns.unshift({ id: annHashId(date + '|' + text), date, text });
    }
    await api('/api/config', { method: 'PUT', body: JSON.stringify({ ...window._cfg, announcements: anns }) });
    showAnnouncements();
  };
  document.querySelectorAll('[data-edit-ann]').forEach((b) => (b.onclick = () => showAnnouncements(b.dataset.editAnn)));
  document.querySelectorAll('[data-del-ann]').forEach((b) => (b.onclick = async () => {
    if (!(await confirmDialog('确定删除该公告？删除后不可恢复。', { danger: true }))) return;
    const anns = (window._cfg.announcements || []).filter((a) => a.id !== b.dataset.delAnn);
    await api('/api/config', { method: 'PUT', body: JSON.stringify({ ...window._cfg, announcements: anns }) });
    showAnnouncements();
  }));
}

      const faq = [];
      const faqEn = [];
      document.querySelectorAll('.faq-item').forEach((item) => {
        const qzh = item.querySelector('.faq-q[data-lang="zh"]')?.value.trim();
        const azh = item.querySelector('.faq-a[data-lang="zh"]')?.value.trim();
        const qen = item.querySelector('.faq-q[data-lang="en"]')?.value.trim();
        const aen = item.querySelector('.faq-a[data-lang="en"]')?.value.trim();
        if (!qzh && !qen) return; // 跳过完全空的条目
        faq.push({ q: qzh || qen, a: azh || aen || '' });
        if (qen || aen) faqEn.push({ q: qen || qzh, a: aen || azh || '' });
      });
      return { faq, faqEn };
    };
    document.getElementById('faq-add').onclick = () => {
      const list = document.getElementById('faq-list');
      const i = list.children.length;
      const div = document.createElement('div');
      div.className = 'faq-item';
      div.innerHTML = `
        <div class="faq-item-head"><span class="faq-item-index">#${i + 1}</span><button type="button" class="btn btn-ghost faq-del" style="padding:2px 8px;font-size:12px">删除</button></div>
        <div class="form-grid">
          <div class="form-row"><label class="field-label">中文问题</label><input class="inp faq-q" data-lang="zh" /></div>
          <div class="form-row"><label class="field-label">英文问题</label><input class="inp faq-q" data-lang="en" /></div>
        </div>
        <div class="form-row"><label class="field-label">中文答案</label><textarea class="inp faq-a" data-lang="zh" rows="2"></textarea></div>
        <div class="form-row"><label class="field-label">英文答案</label><textarea class="inp faq-a" data-lang="en" rows="2"></textarea></div>`;
      list.appendChild(div);
      reindexFaq();
    };
    const reindexFaq = () => {
      document.querySelectorAll('.faq-item').forEach((item, i) => {
        const idx = item.querySelector('.faq-item-index');
        if (idx) idx.textContent = '#' + (i + 1);
      });
    };
    document.getElementById('faq-list').addEventListener('click', (e) => {
      const del = e.target.closest('.faq-del');
      if (del) {
        e.target.closest('.faq-item')?.remove();
        reindexFaq();
      }
    });
    document.getElementById('faq-save').onclick = async () => {
      const { faq, faqEn } = collectFaq();
      const cfg = { ...window._cfg, faq, faqEn: faqEn.length ? faqEn : [] };
      await api('/api/config', { method: 'PUT', body: JSON.stringify(cfg) });
      clearGuard();
      toast('已保存，记得重建前台');
      showContent('faq');
    };
  } else {
    document.getElementById('about-save').onclick = async () => {
      const about = {
        intro: document.getElementById('about-intro').value.trim(),
        note: document.getElementById('about-note').value.trim(),
        disclaimerTitle: document.getElementById('about-disc-title').value.trim(),
        disclaimerItems: document.getElementById('about-disc-items').value.split('\n').map((s) => s.trim()).filter(Boolean),
        criteriaTitle: document.getElementById('about-cri-title').value.trim(),
        criteriaItems: document.getElementById('about-cri-items').value.split('\n').map((s) => s.trim()).filter(Boolean),
        contactTitle: document.getElementById('about-contact-title').value.trim(),
        contactText: document.getElementById('about-contact-text').value.trim(),
      };
      const cfg = { ...window._cfg, about };
      await api('/api/config', { method: 'PUT', body: JSON.stringify(cfg) });
      clearGuard();
      toast('已保存，记得重建前台');
      showContent('about');
    };
  }
}

// ---------- 导出备份 ----------
async function exportData() {
  const data = await api('/api/export');
  const blob = new Blob([JSON.stringify(data, null, 2)], { type: 'application/json' });
  const a = document.createElement('a');
  a.href = URL.createObjectURL(blob);
  a.download = 'tokenfree-backup-' + new Date().toISOString().slice(0, 10) + '.json';
  a.click();
  URL.revokeObjectURL(a.href);
}

          <div class="todo-list">

              <div class="todo-item" data-todo="${t.action}">

          </div>

      })()}

        <div id="aff-panel" class="card" style="border-color:rgba(139,109,255,.35);margin-bottom:20px">
          <p style="font-size:13px;font-weight:500;color:#8b6dff;margin-bottom:8px">🔗 推广链接待补（${stats.affPending.length} 个）——唯一需要人工操作的字段，其余信息均自动采集</p>
          <div style="display:flex;flex-direction:column;gap:6px">

                <button class="btn btn-ghost" data-aff="${esc(s.id)}" data-name="${esc(s.name)}" style="margin-left:auto">粘贴推广链接</button>
              </div>`).join('')}

          <select id="site-status-filter" class="inp" style="width:auto">
            <option value="">全部状态</option>
            ${Object.entries(STATUS).map(([v,l]) => `<option value="${v}">${l}</option>`).join('')}
          </select>
          <span id="site-filter-count" class="hint" style="margin:0;white-space:nowrap"></span>
        </div>
        <div class="site-bulk-bar" id="site-bulk-bar" style="display:none;margin-top:10px">
          <span id="bulk-count" class="hint" style="margin:0">已选 0 个</span>
          <select id="bulk-status" class="inp" style="width:auto">
            <option value="">批量改状态…</option>
            ${Object.entries(STATUS).map(([v,l]) => `<option value="${v}">改为${l}</option>`).join('')}
          </select>
          <button id="bulk-featured" class="btn btn-ghost">批量设为精选</button>
          <button id="bulk-clear" class="btn btn-ghost">取消选择</button>
        </div>
      </div>
      <p class="hint" style="margin:-6px 0 14px">改动站点数据后需点击「重建前台」，前台页面才会更新。</p>
      <div class="table-wrap">
        <table id="site-table">
          <thead><tr>
            <th style="width:32px"><input type="checkbox" id="select-all" title="全选" /></th>
            <th>名称</th><th>倍率</th><th>状态</th><th>网络</th><th>精选</th><th>点击</th><th>核验</th><th></th>
          </tr></thead>
          <tbody>
            ${sites.map(s => {
              const u = stats.uptime && stats.uptime[s.id];
              const live = u && u.checks ? (u.up ? '●' : '✕') : '';
              const liveColor = u && u.checks ? (u.up ? '#22c55e' : '#ef4444') : '#55556a';
              return `
              <tr data-site-row data-name="${esc(s.name)}" data-summary="${esc(s.summary)}" data-tags="${esc((s.tags||[]).join(','))}" data-status="${s.status}">
                <td><input type="checkbox" class="site-check" data-id="${esc(s.id)}" /></td>
                <td class="cell-strong">${esc(s.name)} <span style="color:${liveColor}" title="${u && u.up ? '在线 ' + (u.latencyMs ?? '?') + 'ms' : '不可达/无数据'}">${live}</span> <span style="font-size:11px;color:${s.affUrl ? '#22c55e' : '#f59e0b'}" title="${s.affUrl ? '推广链接已设置' : '推广链接待补'}">${s.affUrl ? 'AFF✓' : 'AFF待补'}</span></td>
                <td class="cell-dim">${s.multiplier ?? '—'}</td>
                <td>${STATUS[s.status] || s.status}</td>
                <td class="cell-dim">${s.network === 'direct' ? '直连' : s.network === 'proxy' ? '代理' : '—'}</td>
                <td>${s.isFeatured ? '⭐' : ''}</td>
                <td>${(stats.clicks && stats.clicks[s.id]) || 0}</td>
                <td class="cell-dim">${esc(s.verifiedAt || '')}</td>
                <td class="cell-actions">
                  <button class="btn btn-ghost" data-edit="${esc(s.id)}">编辑</button>
                  <button class="btn btn-danger" data-del="${esc(s.id)}">删除</button>

        </table>

  bindTopbar();
  // 站点列表搜索 + 状态筛选
  const searchInput = document.getElementById('site-search');
  const statusFilter = document.getElementById('site-status-filter');
  const countEl = document.getElementById('site-filter-count');
  const applySiteFilter = () => {
    const q = (searchInput?.value || '').trim().toLowerCase();
    const st = statusFilter?.value || '';
    let shown = 0;
    document.querySelectorAll('[data-site-row]').forEach((row) => {
      const name = (row.dataset.name || '').toLowerCase();
      const summary = (row.dataset.summary || '').toLowerCase();
      const tags = (row.dataset.tags || '').toLowerCase();
      const okQ = !q || name.includes(q) || summary.includes(q) || tags.includes(q);
      const okSt = !st || row.dataset.status === st;
      const show = okQ && okSt;
      row.style.display = show ? '' : 'none';
      if (show) shown++;
    });
    if (countEl) countEl.textContent = `共 ${shown} 个`;
  };
  searchInput?.addEventListener('input', applySiteFilter);
  statusFilter?.addEventListener('change', applySiteFilter);
  applySiteFilter();
  // 批量操作：多选站点 + 批量改状态/精选
  const bulkBar = document.getElementById('site-bulk-bar');
  const bulkCount = document.getElementById('bulk-count');
  const selectedIds = () => [...document.querySelectorAll('.site-check:checked')].map((c) => c.dataset.id);
  const syncBulk = () => {
    const n = selectedIds().length;
    bulkBar.style.display = n > 0 ? 'flex' : 'none';
    if (bulkCount) bulkCount.textContent = `已选 ${n} 个`;
    const all = document.getElementById('select-all');
    if (all) {
      const checks = document.querySelectorAll('.site-check');
      all.checked = checks.length > 0 && [...checks].every((c) => c.checked);
    }
  };
  document.getElementById('select-all')?.addEventListener('change', (e) => {
    document.querySelectorAll('.site-check').forEach((c) => (c.checked = e.target.checked));
    syncBulk();
  });
  document.querySelectorAll('.site-check').forEach((c) => c.addEventListener('change', syncBulk));
  document.getElementById('bulk-clear')?.addEventListener('click', () => {
    document.querySelectorAll('.site-check').forEach((c) => (c.checked = false));
    syncBulk();
  });
  document.getElementById('bulk-status')?.addEventListener('change', async (e) => {
    const st = e.target.value;
    if (!st) return;
    const ids = selectedIds();
    if (!ids.length) return;
    if (!(await confirmDialog(`确定将选中的 ${ids.length} 个站点改为「${STATUS[st]}」？`, { danger: st === 'offline', okText: '确定' }))) { e.target.value = ''; return; }
    for (const id of ids) await api('/api/sites/' + id, { method: 'PUT', body: JSON.stringify({ status: st }) });
    toast(`已更新 ${ids.length} 个站点状态`);
    showDashboard();
  });
  document.getElementById('bulk-featured')?.addEventListener('click', async () => {
    const ids = selectedIds();
    if (!ids.length) return;
    for (const id of ids) await api('/api/sites/' + id, { method: 'PUT', body: JSON.stringify({ isFeatured: true }) });
    toast(`已将 ${ids.length} 个站点设为精选`);
    showDashboard();
  });
  // 待办事项快捷跳转
  document.querySelectorAll('[data-todo]').forEach((el) => {
    el.onclick = () => {
      const action = el.dataset.todo;
      if (action === 'nav-subs') showSubmissions();
      else if (action === 'aff') document.querySelector('#aff-panel')?.scrollIntoView({ behavior: 'smooth' });
      else if (action === 'suspect') document.querySelector('[data-mark-off]')?.scrollIntoView({ behavior: 'smooth' });
    };
  });
  document.getElementById('add-site').onclick = () => showSiteForm(null);
  document.getElementById('rebuild').onclick = rebuildFrontend;
  document.querySelectorAll('[data-edit]').forEach(b => b.onclick = () => showSiteForm(window._sites.find(s => s.id === b.dataset.edit)));
  document.querySelectorAll('[data-del]').forEach(b => b.onclick = async () => {
    if (!(await confirmDialog('确定删除该站点？删除后不可恢复。', { danger: true, okText: '删除' }))) return;
    await api('/api/sites/' + b.dataset.del, { method: 'DELETE' });
    showDashboard();
  });
  document.querySelectorAll('[data-mark-off]').forEach(b => b.onclick = async () => {
    await api('/api/sites/' + b.dataset.markOff, { method: 'PUT', body: JSON.stringify({ status: 'offline' }) });
    showDashboard();
  });
  document.querySelectorAll('[data-aff]').forEach(b => b.onclick = async () => {
    const aff = prompt(`粘贴「${b.dataset.name}」你的推广链接（注册后在该站的控制台/邀请页面获取，含 aff 参数的完整链接）：`);
    if (aff === null) return;
    const v = aff.trim();
    if (v && !/^https?:\/\//i.test(v)) { toast('请粘贴以 http(s):// 开头的完整链接', 'error'); return; }
    await api('/api/sites/' + b.dataset.aff, { method: 'PUT', body: JSON.stringify({ affUrl: v }) });
    // 前台 /go 跳转链接是构建时烘焙的，保存后必须重建才生效
    try { await api('/api/rebuild', { method: 'POST' }); } catch (e) { toast('推广链接已保存，但重建前台失败：' + e.message, 'error', 4000); }
    showDashboard();
  });
}

// ---------- 监测面板 ----------
async function showUptime() {
  const stats = await api('/api/stats');
  const sites = await api('/api/sites');
  const entries = sites
    .filter(s => s.status !== 'offline' && stats.uptime[s.id] && stats.uptime[s.id].checks > 0)
    .map(s => ({ name: s.name, ...stats.uptime[s.id] }))
    .sort((a, b) => (a.uptime24h ?? 2) - (b.uptime24h ?? 2));
  document.getElementById('app').innerHTML = `
    ${topbar('uptime')}
    <main class="container">
      <div class="section-head">
        <h2 class="section-title">可用性监测</h2>
        <div class="section-actions">
          <button id="collect-now" class="btn">立即采集</button>
          <button id="enrich-now" class="btn">立即核验</button>
          <button id="run-now" class="btn btn-primary">立即检测</button>
        </div>
      </div>
      <p class="hint" style="margin:-6px 0 14px">每 ${stats.monitor.intervalMin} 分钟自动探测一次（GET，8s 超时）。下表按 24h 可用率升序，最差在前。「立即采集」自动发现新站候选（去推广参数 + 探测验证后）进入投稿队列，每天自动跑一次。</p>
      <div class="table-wrap">
        <table>
          <thead><tr><th>站点</th><th>当前</th><th>延迟</th><th>24h 可用率</th><th>检测次数</th></tr></thead>
          <tbody>
            ${entries.map(e => `
              <tr>
                <td class="cell-strong">${esc(e.name)}</td>
                <td style="color:${e.up ? '#22c55e' : '#ef4444'}">${e.up ? '● 在线' : '✕ 不可达'}</td>
                <td class="cell-dim">${e.latencyMs != null ? e.latencyMs + 'ms' : '—'}</td>
                <td>${e.uptime24h != null ? Math.round(e.uptime24h * 100) + '%' : '—'}</td>
                <td class="cell-dim">${e.checks}</td>
              </tr>`).join('')}
          </tbody>
        </table>
      </div>
      ${entries.length === 0 ? '<p class="hint" style="margin-top:14px">暂无监测数据，点击「立即检测」开始第一轮。</p>' : ''}
    </main>`;

  bindTopbar();
  const btn = document.getElementById('run-now');
  btn.onclick = async () => {
    btn.disabled = true; btn.textContent = '检测中…（约30s）';
    try {
      await api('/api/monitor/run', { method: 'POST' });
      showUptime();
    } catch (e) {
      btn.textContent = '失败：' + e.message;
      setTimeout(() => { btn.disabled = false; btn.textContent = '立即检测'; }, 3000);
    }
  };
  const collectBtn = document.getElementById('collect-now');
  collectBtn.onclick = async () => {
    collectBtn.disabled = true; collectBtn.textContent = '采集中…（约1-2分钟）';
    try {
      const r = await api('/api/collect/run', { method: 'POST' });
      toast(`采集完成：抓取 ${r.fetched} 个 → 新候选 ${r.candidates} 个 → 探测通过 ${r.verified} 个，已入投稿队列 ${r.added} 个（被拒 ${r.rejected} 个）。到「投稿」页审核收录。`, 'success', 5000);
      collectBtn.textContent = '立即采集';
      collectBtn.disabled = false;
    } catch (e) {
      collectBtn.textContent = '失败：' + e.message;
      setTimeout(() => { collectBtn.disabled = false; collectBtn.textContent = '立即采集'; }, 4000);
    }
  };
  const enrichBtn = document.getElementById('enrich-now');
  enrichBtn.onclick = async () => {
    enrichBtn.disabled = true; enrichBtn.textContent = '核验中…（约1分钟）';
    try {
      const r = await api('/api/enrich/run', { method: 'POST' });
      const lines = (r.changed || []).map(c => `· ${c.name}：${c.changes.join('；')}`).join('\n');
      toast(`核验完成：在线 ${r.up}/${r.checked} 站，${r.changed.length} 站有更新，新增记录 ${r.eventsAdded} 条${r.rebuildTriggered ? '，前台已自动重建' : ''}。${lines || '（无变化）'}`, 'success', 5000);
      enrichBtn.textContent = '立即核验';
      enrichBtn.disabled = false;
    } catch (e) {
      enrichBtn.textContent = '失败：' + e.message;
      setTimeout(() => { enrichBtn.disabled = false; enrichBtn.textContent = '立即核验'; }, 4000);
    }
  };
}

// ---------- 重建前台 ----------
async function rebuildFrontend() {
  const btn = document.getElementById('rebuild');
  btn.disabled = true; btn.textContent = '构建中…';
  try {
    const r = await api('/api/rebuild', { method: 'POST' });
    btn.textContent = '✓ 已重建'; btn.classList.add('success-msg');
    setTimeout(() => { btn.textContent = '重建前台'; btn.classList.remove('success-msg'); btn.disabled = false; }, 2500);
  } catch (e) {
    btn.textContent = '构建失败：' + e.message;
    setTimeout(() => { btn.textContent = '重建前台'; btn.disabled = false; }, 4000);
  }
}

// ---------- 站点表单 ----------
const TOOL_OPTS = [
  { id: 'claude-code', name: 'Claude Code' },
  { id: 'cursor', name: 'Cursor' },
  { id: 'codex-cli', name: 'Codex CLI' },
  { id: 'cline', name: 'Cline' },
];
const NET_OPTS = { unknown: '未验证', direct: '国内直连', proxy: '需代理' };

async function showSiteForm(site, prefill = null, afterSaveDeleteSub = null) {
  const isNew = !site;
  const models = await api('/api/models');
  site = site || { name:'', url:'', affUrl:'', multiplier:'', bonus:'', models:[], tags:[], summary:'', description:'', status:'stable', network:'unknown', tools:[], isFeatured:false, sortOrder:99 };
  if (prefill) Object.assign(site, prefill);
  document.getElementById('app').innerHTML = `
    ${topbar('dash')}
    <main class="container container-sm">
      <div class="section-head">
        <h2 class="section-title">${isNew ? '新增站点' : '编辑：' + esc(site.name)}</h2>
        <button id="back" class="btn btn-ghost">← 返回</button>
      </div>
      <form id="site-form" class="card">
        <fieldset class="form-section">
          <legend class="form-section-title">基本信息</legend>
          <div class="form-row">
            <label class="field-label">名称 *</label>
            <input id="f-name" class="inp" required value="${esc(site.name)}" />
          </div>
          <div class="form-row">
            <label class="field-label">URL（留空则前台显示"链接待补充"）</label>
            <input id="f-url" class="inp" placeholder="https://…" value="${esc(site.url)}" />
          </div>
          <div class="form-row">
            <label class="field-label">一句话简介 *</label>
            <input id="f-summary" class="inp" required value="${esc(site.summary)}" />
          </div>
          <div class="form-row">
            <label class="field-label">详细描述</label>
            <textarea id="f-desc" class="inp" rows="4">${esc(site.description)}</textarea>
          </div>
        </fieldset>

        <fieldset class="form-section">
          <legend class="form-section-title">价格与状态</legend>
          <div class="form-grid">
            <div class="form-row">
              <label class="field-label">倍率（如 0.4，留空为未知）</label>
              <input id="f-mult" class="inp" type="number" step="0.01" min="0" value="${site.multiplier ?? ''}" />
            </div>
            <div class="form-row">
              <label class="field-label">状态</label>
              <select id="f-status" class="inp">${Object.entries(STATUS).map(([v,l]) => `<option value="${v}" ${site.status===v?'selected':''}>${l}</option>`).join('')}</select>
            </div>
          </div>
          <div class="form-grid">
            <div class="form-row">
              <label class="field-label">网络可达性</label>
              <select id="f-network" class="inp">${Object.entries(NET_OPTS).map(([v,l]) => `<option value="${v}" ${(site.network||'unknown')===v?'selected':''}>${l}</option>`).join('')}</select>
            </div>
            <div class="form-row">
              <label class="field-label">充值汇率（每 1 刀额度所需人民币，如 7.5；用于折算实际倍率）</label>
              <input id="f-toprate" class="inp" type="number" step="0.01" min="0" value="${site.topupRate ?? ''}" />
            </div>
          </div>
          <div class="form-row">
            <label class="field-label">注册赠送</label>
            <input id="f-bonus" class="inp" value="${esc(site.bonus)}" />
          </div>
          <div class="form-row">
            <label class="field-label">邀请码 / 兑换口令（前台一键复制，可留空）</label>
            <input id="f-invite" class="inp" value="${esc(site.inviteCode || '')}" />
          </div>
        </fieldset>

        <fieldset class="form-section">
          <legend class="form-section-title">推广与运营</legend>
          <div class="form-row">
            <label class="field-label">推广链接 affUrl（可选：设置后跳转用它，用于返佣）</label>
            <input id="f-affurl" class="inp" placeholder="https://…?aff=你的码" value="${esc(site.affUrl || '')}" />
          </div>
          <div class="form-row">
            <label class="field-label">获奖理由（榜单缎带，如：最佳白嫖 / 最低价 / 最稳老站）</label>
            <input id="f-award" class="inp" value="${esc(site.award || '')}" />
          </div>
          <div class="form-row">
            <label class="field-label">API Base URL（如 https://api.example.com/v1）</label>
            <input id="f-apibase" class="inp" value="${esc(site.apiBase || '')}" placeholder="https://…/v1" />
          </div>
        </fieldset>

        <fieldset class="form-section">
          <legend class="form-section-title">模型与标签</legend>
          <div class="form-row">
            <label class="field-label">支持模型</label>
            <div class="checkbox-row">
              ${models.map(m => `<label class="checkbox-item">
                <input type="checkbox" name="models" value="${esc(m.id)}" ${site.models.includes(m.id)?'checked':''} />
                <span style="color:${esc(m.color)}">${esc(m.name)}</span></label>`).join('')}
            </div>
          </div>
          <div class="form-row">
            <label class="field-label">工具兼容</label>
            <div class="checkbox-row">
              ${TOOL_OPTS.map(t => `<label class="checkbox-item">
                <input type="checkbox" name="tools" value="${t.id}" ${(site.tools||[]).includes(t.id)?'checked':''} />
                ${t.name}</label>`).join('')}
            </div>
          </div>
          <div class="form-row">
            <label class="field-label">标签（逗号分隔，如：签到,生图,稳定）</label>
            <input id="f-tags" class="inp" value="${esc((site.tags||[]).join(','))}" />
          </div>
        </fieldset>

        <fieldset class="form-section">
          <legend class="form-section-title">英文内容（可选）</legend>
          <div class="form-row">
            <label class="field-label">英文简介（EN 模式下替换中文摘要）</label>
            <input id="f-summary-en" class="inp" value="${esc(site.summaryEn || '')}" />
          </div>
          <div class="form-row">
            <label class="field-label">英文详细描述（EN 模式下替换中文描述）</label>
            <textarea id="f-desc-en" class="inp" rows="3">${esc(site.descriptionEn || '')}</textarea>
          </div>
        </fieldset>

        <fieldset class="form-section">
          <legend class="form-section-title">记录与排序</legend>
          <div class="form-row">
            <label class="field-label">体验日志（每行一条：日期 | 事件，如 2026-08-22 | GPT分组调价到0.02x）</label>
            <textarea id="f-events" class="inp" rows="3" placeholder="2026-08-22 | 降价活动，Claude 0.01x">${(site.events || []).map(e => `${e.date} | ${e.text}`).join('\n')}</textarea>
          </div>
          <div class="form-grid">
            <div class="form-row">
              <label class="field-label">核验日期</label>
              <input id="f-verified" class="inp" type="date" value="${esc(site.verifiedAt || new Date().toISOString().slice(0,10))}" />
            </div>
            <div class="form-row">
              <label class="field-label">排序（小在前）</label>
              <input id="f-sort" class="inp" type="number" value="${site.sortOrder ?? 99}" />
            </div>
          </div>
          <div class="form-row">
            <label class="checkbox-item"><input id="f-featured" type="checkbox" ${site.isFeatured?'checked':''} /> 编辑精选 ⭐</label>
          </div>
        </fieldset>

        <div class="form-actions">
          <button type="submit" class="btn btn-primary">保存</button>
          <button type="button" id="cancel" class="btn btn-ghost">取消</button>
        </div>
      </form>
    </main>`;

  bindTopbar();
  // 未保存离开提醒
  let dirty = false;
  const markDirty = () => { dirty = true; };
  document.getElementById('site-form').querySelectorAll('input, textarea, select').forEach((el) => {
    el.addEventListener('input', markDirty);
    el.addEventListener('change', markDirty);
  });
  const beforeUnload = (e) => { if (dirty) { e.preventDefault(); e.returnValue = ''; } };
  window.addEventListener('beforeunload', beforeUnload);
  const leaveClean = () => { dirty = false; window.removeEventListener('beforeunload', beforeUnload); };
  document.getElementById('back').onclick = () => { leaveClean(); showDashboard(); };
  document.getElementById('cancel').onclick = () => { leaveClean(); showDashboard(); };
  document.getElementById('site-form').onsubmit = async (e) => {
    e.preventDefault();
    const body = {
      name: document.getElementById('f-name').value.trim(),
      url: document.getElementById('f-url').value.trim(),
      affUrl: document.getElementById('f-affurl').value.trim(),
      multiplier: document.getElementById('f-mult').value === '' ? null : Number(document.getElementById('f-mult').value),
      status: document.getElementById('f-status').value,
      network: document.getElementById('f-network').value,
      bonus: document.getElementById('f-bonus').value.trim(),
      inviteCode: document.getElementById('f-invite').value.trim(),
      topupRate: document.getElementById('f-toprate').value === '' ? null : Number(document.getElementById('f-toprate').value),
      award: document.getElementById('f-award').value.trim(),
      apiBase: document.getElementById('f-apibase').value.trim(),
      summaryEn: document.getElementById('f-summary-en').value.trim(),
      models: [...document.querySelectorAll('input[name=models]:checked')].map(i => i.value),
      tools: [...document.querySelectorAll('input[name=tools]:checked')].map(i => i.value),
      tags: document.getElementById('f-tags').value.split(/[,，]/).map(t => t.trim()).filter(Boolean),
      summary: document.getElementById('f-summary').value.trim(),
      description: document.getElementById('f-desc').value.trim(),
      descriptionEn: document.getElementById('f-desc-en').value.trim(),
      events: document.getElementById('f-events').value.split('\n').map(l => {
        const [date, ...rest] = l.split('|');
        return { date: (date || '').trim(), text: rest.join('|').trim() };
      }).filter(e => e.date && e.text),
      verifiedAt: document.getElementById('f-verified').value,
      sortOrder: Number(document.getElementById('f-sort').value) || 99,
      isFeatured: document.getElementById('f-featured').checked,
    };
    if (isNew) await api('/api/sites', { method: 'POST', body: JSON.stringify(body) });
    else await api('/api/sites/' + site.id, { method: 'PUT', body: JSON.stringify(body) });
    // 从投稿收录时，保存后自动删除该投稿
    if (afterSaveDeleteSub) await api('/api/submissions/' + afterSaveDeleteSub, { method: 'DELETE' }).catch(() => {});
    leaveClean();
    toast('已保存。记得点击「重建前台」让前台生效', 'success', 3500);
    showDashboard();
  };
}

// ---------- 模型标签管理 ----------
async function showModels() {
  const models = await api('/api/models');
  window._models = models;
  document.getElementById('app').innerHTML = `
    ${topbar('models')}
    <main class="container container-sm">
      <div class="section-head">
        <h2 class="section-title">模型标签</h2>
        <button id="back" class="btn btn-ghost">← 返回</button>
      </div>
      <div class="card">
        <div class="chips-wrap" id="chips">
          ${models.map((m, i) => `
            <span class="model-chip" data-i="${i}">
              <span class="model-dot" style="background:${esc(m.color)}"></span>
              ${esc(m.name)} <span class="cell-dim" style="font-size:11px">${esc(m.id)}</span>
              <button data-del-model="${i}" title="删除">×</button>
            </span>`).join('')}
        </div>
        <form id="model-form" class="inline-form">
          <div><label class="field-label">ID（英文，如 gpt）</label><input id="m-id" class="inp" required pattern="[a-z0-9-]+" /></div>
          <div><label class="field-label">显示名</label><input id="m-name" class="inp" required /></div>
          <div><label class="field-label">颜色</label><input id="m-color" class="inp" type="color" value="#6b7280" style="padding:4px;height:35px" /></div>
          <button type="submit" class="btn btn-primary">添加</button>
        </form>
        <p class="hint">新增或删除模型后，记得「重建前台」。已有关联站点的模型删除后，前台会自动忽略未知模型。</p>
      </div>
    </main>`;

  bindTopbar();
  const backBtn = document.getElementById('back');
  if (backBtn) backBtn.onclick = showDashboard;
  document.querySelectorAll('[data-del-model]').forEach(b => b.onclick = async () => {
    if (!(await confirmDialog('确定删除该模型标签？已关联站点的模型删除后前台会自动忽略。', { danger: true, okText: '删除' }))) return;
    const next = window._models.filter((_, i) => i !== Number(b.dataset.delModel));
    await api('/api/models', { method: 'PUT', body: JSON.stringify(next) });
    showModels();
  });
  document.getElementById('model-form').onsubmit = async (e) => {
    e.preventDefault();
    const m = {
      id: document.getElementById('m-id').value.trim(),
      name: document.getElementById('m-name').value.trim(),
      color: document.getElementById('m-color').value,
    };
    if (window._models.some(x => x.id === m.id)) return toast('该 ID 已存在', 'error');
    await api('/api/models', { method: 'PUT', body: JSON.stringify([...window._models, m]) });
    showModels();
  };
}
