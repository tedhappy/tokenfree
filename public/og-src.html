<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<style>
  * { margin: 0; padding: 0; }
  body {
    width: 1280px; height: 720px; overflow: hidden;
    background: #0a0a0f;
    font-family: -apple-system, 'Segoe UI', 'PingFang SC', 'Microsoft YaHei', sans-serif;
    display: flex; align-items: center; justify-content: center;
    position: relative;
  }
  .glow {
    position: absolute; top: -200px; left: 50%; transform: translateX(-50%);
    width: 900px; height: 500px; border-radius: 50%;
    background: radial-gradient(ellipse, rgba(124,92,252,0.22), transparent 70%);
  }
  .card {
    position: relative; text-align: center; padding: 0 80px;
  }
  .logo {
    display: inline-flex; align-items: center; gap: 14px; margin-bottom: 36px;
  }
  .logo-badge {
    width: 64px; height: 64px; border-radius: 16px;
    background: linear-gradient(135deg, #8b6dff, #5b3fd1);
    display: flex; align-items: center; justify-content: center;
  }
  .logo-badge svg { width: 38px; height: 38px; }
  .logo-name { font-size: 30px; font-weight: 600; color: #e8e8ed; letter-spacing: 1px; }
  h1 {
    font-size: 76px; font-weight: 700; color: #e8e8ed;
    line-height: 1.15; margin-bottom: 24px; letter-spacing: -1px;
  }
  h1 .accent {
    background: linear-gradient(90deg, #a78bfa, #7c5cfc);
    -webkit-background-clip: text; background-clip: text; color: transparent;
  }
  p { font-size: 28px; color: #8888a0; line-height: 1.6; }
  .stats {
    display: flex; justify-content: center; gap: 48px; margin-top: 52px;
  }
  .stat { text-align: center; }
  .stat .num { font-size: 40px; font-weight: 700; color: #22c55e; font-variant-numeric: tabular-nums; }
  .stat .label { font-size: 18px; color: #55556a; margin-top: 4px; }
</style>
</head>
<body>
  <div class="glow"></div>
  <div class="card">
    <div class="logo">
      <div class="logo-badge">
        <svg viewBox="0 0 48 48" fill="none">
          <path d="M15 16.5h18" stroke="#fff" stroke-width="5" stroke-linecap="round"/>
          <path d="M24 16.5v11" stroke="#fff" stroke-width="5" stroke-linecap="round"/>
          <path d="M17.5 26.5 24 33l6.5-6.5" stroke="#fff" stroke-width="4.5" stroke-linecap="round" stroke-linejoin="round"/>
        </svg>
      </div>
      <span class="logo-name">TokenFree</span>
    </div>
    <h1>AI Token <span class="accent">中转站导航</span></h1>
    <p>收录可用、稳定的 AI API 中转站<br>免费额度 · 低价倍率 · 实时监测</p>
    <div class="stats">
      <div class="stat"><div class="num">54</div><div class="label">收录站点</div></div>
      <div class="stat"><div class="num">24h</div><div class="label">自动监测</div></div>
      <div class="stat"><div class="num">0</div><div class="label">广告干扰</div></div>
    </div>
  </div>
</body>
</html>
